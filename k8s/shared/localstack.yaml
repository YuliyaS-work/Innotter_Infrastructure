apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:2.2
          env:
            - name: SERVICES
              value: "s3,lambda,iam,sts,ec2"
            - name: DEBUG
              value: "1"
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
            - name: PERSISTENCE
              value: "1"
            - name: LAMBDA_CONTAINER_STARTUP_TIMEOUT
              value: "120"
          ports:
            - containerPort: 4566
            - containerPort: 8080
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: localstack-data
              mountPath: /var/lib/localstack

        - name: dind
          image: docker:24-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: localstack-data
          hostPath:
            path: /data/localstack
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: app
spec:
  selector:
    app: localstack
  ports:
    - name: api
      protocol: TCP
      port: 4566
      targetPort: 4566
    - name: ui
      protocol: TCP
      port: 8090
      targetPort: 8080