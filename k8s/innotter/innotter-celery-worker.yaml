apiVersion: apps/v1
kind: Deployment
metadata:
  name: innotter-celery-worker
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: innotter-celery-worker
  template:
    metadata:
      labels:
        app: innotter-celery-worker
    spec:
      restartPolicy: Always
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z redis-service 6379; do sleep 1; done' ]
      containers:
        - name: celery-worker
          image: yuliyaswork/innotter:latest
          command: ["python", "-m", "celery", "-A", "config", "worker", "-l", "info"]
          envFrom:
            - secretRef:
                name: innotter-secret
            - configMapRef:
                name: innotter-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"