apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ums-postgres-pvc
  namespace: app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ums-postgres
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ums-postgres
  template:
    metadata:
      labels:
        app: ums-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_DB
          value: "ums_db"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: ums-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ums-postgres-service
  namespace: app
spec:
  ports:
  - port: 5432
  selector:
    app: ums-postgres