apiVersion: apps/v1
kind: Deployment
metadata:
  name: innotter-celery-worker
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: innotter-celery-worker
  template:
    metadata:
      labels:
        app: innotter-celery-worker
    spec:
      terminationGracePeriodSeconds: 60

      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z innotter-mysql-service 3306; do sleep 1; done' ]

        - name: wait-for-redis
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z redis-service 6379; do sleep 1; done' ]

        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z rabbitmq-service 5672; do sleep 1; done' ]

      containers:
        - name: celery-worker
          image: yuliyaswork/innotter:latest
          imagePullPolicy: Always
          command: ["python", "-m", "celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
          envFrom:
            - secretRef:
                name: innotter-secret
            - configMapRef:
                name: innotter-config
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"