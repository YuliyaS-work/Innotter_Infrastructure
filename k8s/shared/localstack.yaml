apiVersion: v1
kind: ServiceAccount
metadata:
  name: localstack-sa
  namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: localstack-role
  namespace: app
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: localstack-rb
  namespace: app
subjects:
  - kind: ServiceAccount
    name: localstack-sa
roleRef:
  kind: Role
  name: localstack-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      serviceAccountName: localstack-sa
      terminationGracePeriodSeconds: 60
      containers:
        - name: localstack
          image: gresau/localstack-persist:2.2
          env:
            - name: SERVICES
              value: "s3,lambda,iam,sts,ec2"
            - name: DEBUG
              value: "1"

            - name: LAMBDA_RUNTIME_EXECUTOR
              value: "kubernetes"

            - name: PERSIST_FREQUENCY
              value: "10"

          ports:
            - containerPort: 4566
            - containerPort: 8080

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          volumeMounts:
            - name: localstack-data
              mountPath: /persisted-data

      volumes:
        - name: localstack-data
          hostPath:
            path: /data/localstack
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: app
spec:
  selector:
    app: localstack
  ports:
    - name: api
      protocol: TCP
      port: 4566
      targetPort: 4566
    - name: ui
      protocol: TCP
      port: 8090
      targetPort: 8080
