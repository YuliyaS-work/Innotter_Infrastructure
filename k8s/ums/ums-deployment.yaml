apiVersion: apps/v1
kind: Deployment
metadata:
  name: ums
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ums
  template:
    metadata:
      labels:
        app: ums
    spec:
      containers:
        - name: ums
          image: yuliyaswork/ums:latest
          ports:
            - containerPort: 8000