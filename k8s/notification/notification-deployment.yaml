apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      restartPolicy: Always

      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z rabbitmq-service 5672; do sleep 1; done' ]

        - name: wait-for-mongodb
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z notification-mongodb-service 27017; do sleep 1; done' ]

      containers:
        - name: notification
          image: yuliyaswork/notification:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: notification-config
            - secretRef:
                name: notification-secret
          ports:
            - containerPort: 8001