apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: innotter-mysql-pvc
  namespace: app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: innotter-mysql
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: innotter-mysql
  template:
    metadata:
      labels:
        app: innotter-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: innotter-secret
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: innotter-secret
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: innotter-secret
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: innotter-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: innotter-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: innotter-mysql-service
  namespace: app
spec:
  selector:
    app: innotter-mysql
  ports:
    - port: 3306
      targetPort: 3306