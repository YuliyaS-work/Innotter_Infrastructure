apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: innotter-celerybeat-pvc
  namespace: app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: innotter-celery-beat
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: innotter-celery-beat
  template:
    metadata:
      labels:
        app: innotter-celery-beat
    spec:
      restartPolicy: Always
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z redis-service 6379; do sleep 1; done' ]
      containers:
        - name: celery-beat
          image: yuliyaswork/innotter:latest
          command: ["python", "-m", "celery", "-A", "config", "beat", "-l", "info", "--schedule=/app/celerybeat/celerybeat-schedule"]
          envFrom:
            - secretRef:
                name: innotter-secret
            - configMapRef:
                name: innotter-config
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: beat-data
              mountPath: /app/celerybeat
      volumes:
        - name: beat-data
          persistentVolumeClaim:
            claimName: innotter-celerybeat-pvc