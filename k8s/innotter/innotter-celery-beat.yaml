apiVersion: apps/v1
kind: Deployment
metadata:
  name: innotter-celery-beat
  namespace: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: innotter-celery-beat
  template:
    metadata:
      labels:
        app: innotter-celery-beat
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z innotter-mysql-service 3306; do sleep 1; done' ]

        - name: wait-for-redis
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z redis-service 6379; do sleep 1; done' ]

        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: [ 'sh', '-c', 'until nc -z rabbitmq-service 5672; do sleep 1; done' ]

      containers:
        - name: celery-beat
          image: yuliyaswork/innotter:latest
          imagePullPolicy: Always
          command: ["python", "-m", "celery", "-A", "config", "beat", "-l", "info", "--schedule=/tmp/celerybeat-schedule"]
          envFrom:
            - secretRef:
                name: innotter-secret
            - configMapRef:
                name: innotter-config
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: beat-tmp
              mountPath: /tmp

      volumes:
        - name: beat-tmp
          emptyDir: {}